# Laravel(API) + React(SPA) の開発用構成
# 起動: docker compose up -d
services:
  # Webサーバー(リバースプロキシ)。php-fpm へ中継する
  web:
    image: nginx:1.30-alpine        # 安定版(stable)系列。pull して nginx -v で修正版か確認する
    ports:
      - "127.0.0.1:8080:80"         # 自分のPCからだけアクセス可。外部には公開しない
    volumes:
      - ./backend:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    security_opt:
      - no-new-privileges:true

  # PHP-FPM + Composer(Laravel本体)
  app:
    build:
      context: ./docker/php
    volumes:
      - ./backend:/var/www
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    # 9000番ポートは公開しない(compose内のネットワークだけで通信)

  # データベース
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Tokyo
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"       # DBクライアントを使わないなら、この2行は削除してよい
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  # React(Vite)の開発サーバー
  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      API_PROXY_TARGET: http://web   # /api と /sanctum を nginx へ中継する
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - web

volumes:
  db-data:
  frontend-node-modules:
